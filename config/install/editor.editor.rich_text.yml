langcode: en
status: true
dependencies:
  config:
    - filter.format.rich_text
  module:
    - ckeditor5
format: rich_text
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - strikethrough
      - style
      - superscript
      - Callout
      - iframeEmbed
      - tide_media
      - ckeditorTemplates
      - subscript
      - removeFormat
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - insertTable
      - horizontalLine
      - '|'
      - alignment
      - indent
      - outdent
      - heading
      - '|'
      - undo
      - redo
      - sourceEditing
      - '|'
      - code
      - codeBlock
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<footer>'
        - '<span>'
        - '<img src alt data-entity-type data-entity-uuid data-align data-caption>'
        - '<div class="quotation button button--secondary">'
        - '<drupal-entity data-entity-type data-embed-button data-show-last-updated>'
        - '<a hreflang target>'
        - '<blockquote cite>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<p class="quotation__quote">'
    ckeditor5_style:
      styles:
        -
          label: Callout
          element: '<p class="wysiwyg-callout">'
        -
          label: 'Callout (Ordered list)'
          element: '<ol class="wysiwyg-callout">'
        -
          label: 'Callout (Unordered list)'
          element: '<ul class="wysiwyg-callout">'
    ckeditor_iframe_embed_iframeembed:
      enabled_optional_attributes:
        - height
        - width
        - name
        - tabindex
        - title
        - allowfullscreen
        - loading
        - referrerpolicy
    ckeditor_templates_plugin:
      replace_content: false
    editor_advanced_link_link:
      enabled_attributes:
        - class
        - id
        - rel
        - target
        - title
    linkit_extension:
      linkit_enabled: true
      linkit_profile: site_content
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
